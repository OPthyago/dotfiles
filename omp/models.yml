providers:
  vllm:
    baseUrl: http://127.0.0.1:1235/v1
    auth: none
    api: openai-completions
    models:
      - id: qwen3.8-27b
        name: Qwen 3.8 27B
        contextWindow: 131072
        maxTokens: 16384
        reasoning: true
        input: [text, image]
        compat:
          # thinkingFormat openai => OMP emite reasoning_effort por nivel.
          # O template do Qwen3.8 aceita SO xhigh|medium|low (high e alias de xhigh);
          # minimal e max retornam HTTP 400 -> mapeados abaixo.
          thinkingFormat: openai
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: low
            low: low
            medium: medium
            high: xhigh
            xhigh: xhigh
            max: xhigh
          # O toggle de thinking vai por chat_template_kwargs, independente do effort.
          # Baseline = desligado; whenThinking liga. No template o bloco de
          # reasoning_effort fica dentro do "if enable_thinking", entao com o
          # thinking off o effort e simplesmente ignorado (sem risco de 400).
          extraBody:
            chat_template_kwargs:
              enable_thinking: false
          whenThinking:
            extraBody:
              chat_template_kwargs:
                enable_thinking: true
          # vLLM 0.27.1 emite 'reasoning', nao 'reasoning_content'
          reasoningContentField: reasoning_content
